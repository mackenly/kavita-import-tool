name: Version Bump

on:
  workflow_run:
    workflows: ["App Test"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  version-bump:
    # Tauri 1.x links against webkit2gtk 4.0, which Ubuntu 24.04 (ubuntu-latest/noble) dropped.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # Skip chore/ci release commits so this job does not loop after it pushes.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.workflow_run.head_commit.message, 'chore:') && !contains(github.event.workflow_run.head_commit.message, 'ci:') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is required for Tauri v1 (this app). webkitgtk 4.1 is Tauri v2-only.

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Bump npm version
        id: versioning
        uses: phips28/gh-action-bump-version@master
        with:
            tag-prefix: 'v'
            tag-suffix: ''
            patch-wording: 'bump-patch,fixes,Fixes,bugfix,Bugfix,patch,hotfix,Hotfix'
            minor-wording: 'bump-minor,adds,Adds,new'
            major-wording: 'bump-major,MAJOR,removes,Removes,delete,Delete'
            skip-commit: true
            skip-tag: true
            skip-push: true
            target-branch: main
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Cargo.toml version
        run: |
          # get version and remove the v prefix
          export newTagNum=$(echo ${{ steps.versioning.outputs.newTag }} | sed 's/v//')
          # if not a semver throw an error
          if ! [[ $newTagNum =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: The new version is not a semantic version"
            exit 1
          fi
          # Update Cargo.toml
          sed -i 's/version = "[0-9]\+\.[0-9]\+\.[0-9]\+"/version = "'$newTagNum'"/' src-tauri/Cargo.toml
          # Update tauri.conf.json
          sed -i 's/"version": "[0-9.]\+"/"version": "'"$newTagNum"'"/' src-tauri/tauri.conf.json
          # Make sure Cargo.lock is updated
          cargo build --manifest-path src-tauri/Cargo.toml

      - name: Commit and tag version
        run: |
          git config --local user.email "no-reply@tricitiesmediagroup.com"
          git config --local user.name "Versioning Bot"
          git add src-tauri/Cargo.toml
          git add src-tauri/Cargo.lock
          git add src-tauri/tauri.conf.json
          git add package.json
          git commit -m "chore: release ${{ steps.versioning.outputs.newTag }}"
          git pull --rebase origin main
          git push
          git tag -a ${{ steps.versioning.outputs.newTag }} -m "Release ${{ steps.versioning.outputs.newTag }}"
          git push --follow-tags
